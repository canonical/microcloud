name: GHA Security Analysis

on:
  push:
    branches:
      - main
      - v*-edge
      - release-*
  pull_request:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read # only needed for private or internal repos
      actions: read # only needed for private or internal repos
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Use annotations on forks and advanced security features on the main repo.
          annotations: "${{ github.repository == 'canonical/microcloud' && 'false' || 'true' }}"
          advanced-security: "${{ github.repository == 'canonical/microcloud' && 'true' || 'false' }}"
